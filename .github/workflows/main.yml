name: Android CI & Release Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Sign APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode and verify keystores
        id: keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_ALIAS }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            keytool -list -keystore "${{ github.workspace }}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" > /dev/null
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/debug-build.log || {
            echo "::error::Debug APK build failed. Last 50 lines:"
            tail -n 50 /tmp/debug-build.log
            exit 1
          }

      - name: Run Unit Tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee /tmp/test-build.log || {
            echo "::error::Unit tests failed. Last 50 lines:"
            tail -n 50 /tmp/test-build.log
            exit 1
          }

      - name: Build Signed Release APK and AAB
        if: steps.keystores.outputs.has_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --console=plain 2>&1 | tee /tmp/release-build.log || {
            echo "::error::Release build failed. Last 50 lines:"
            tail -n 50 /tmp/release-build.log
            exit 1
          }

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Release APK & AAB artifacts
        if: steps.keystores.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: human-atlas-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Clean up temporary keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks" debug.keystore /tmp/*-build.log
